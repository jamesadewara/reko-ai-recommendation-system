name: Staging CI Pipeline

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/reko-ai-recommendation-system

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run unit & integration tests
        env:
          DEBUG: "True"
          INTERNAL_SERVICE_SECRET: ${{ secrets.INTERNAL_SERVICE_SECRET }}
        run: |
          pytest tests/ -v --cov=app --cov-report=xml

  build-staging:
    name: Build Staging Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build staging image (x64 for healthcheck)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  healthcheck:
    name: Healthcheck Test
    runs-on: ubuntu-latest
    needs: build-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load --input /tmp/image.tar

      - name: Start container
        run: |
          docker run -d \
            --name reko-test-container \
            -p 8000:8000 \
            -e DEBUG=True \
            -e INTERNAL_SERVICE_SECRET=${{ secrets.INTERNAL_SERVICE_SECRET }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
          
          # Wait for container to be healthy (heavy start)
          for i in {1..60}; do
            if curl -f http://localhost:8000/health/ > /dev/null 2>&1; then
              echo "✅ Container is healthy"
              exit 0
            fi
            echo "⏳ Waiting for container... ($i/60)"
            sleep 2
          done
          
          echo "❌ Container healthcheck failed"
          docker logs reko-test-container
          exit 1

      - name: Cleanup
        if: always()
        run: docker stop reko-test-container || true
