---
# Reko AI Recommendation System - OCI A1 Deployment Playbook
# This playbook deploys the application to Oracle Cloud A1 (ARM64) instances

- name: Deploy Reko AI Recommendation System to OCI
  hosts: reko_oci_instances
  become: yes
  gather_facts: yes

  vars:
    docker_compose_dir: /opt/reko-recommendation-system
    docker_image: "{{ docker_image }}"
    docker_username: "{{ docker_username }}"
    docker_password: "{{ docker_password }}"
    health_check_url: "http://localhost:8000/health/"
    health_check_retries: 60
    health_check_delay: 5

  pre_tasks:
    - name: Display deployment info
      debug:
        msg:
          - "🚀 Deploying to OCI A1: {{ inventory_hostname }}"
          - "📦 Image: {{ docker_image }}"
          - "🏗️  Application directory: {{ docker_compose_dir }}"

    - name: Check if Docker is installed
      command: docker --version
      register: docker_version
      failed_when: false
      changed_when: false

    - name: Install Docker if not present (OCI A1 / Ubuntu)
      block:
        - name: Update package cache
          apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: Install Docker
          shell: |
            curl -fsSL https://get.docker.com -o get-docker.sh
            sh get-docker.sh

        - name: Ensure Docker Compose plugin is installed
          apt:
            name: docker-compose-v2
            state: present
          failed_when: false
      when: docker_version.rc != 0

    - name: Verify Docker is running
      service:
        name: docker
        state: started
        enabled: yes

  tasks:
    # PHASE 1: Prepare Application Directory
    - name: Create application directory
      file:
        path: "{{ docker_compose_dir }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy docker-compose.yml to OCI
      copy:
        src: ../docker-compose.yml
        dest: "{{ docker_compose_dir }}/docker-compose.yml"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0644'

    - name: Create .env file from environment variables
      copy:
        dest: "{{ docker_compose_dir }}/.env"
        content: |
          # Generated by Ansible Deployment
          DEBUG=False
          APP_NAME=reko-ai-recommendation-system
          DATABASE_URL={{ database_url }}
          RABBITMQ_URL={{ rabbitmq_url }}
          MONGO_URL={{ mongo_url }}
          GEMINI_API_KEY={{ gemini_api_key }}
          DEEPSEEK_API_KEY={{ deepseek_api_key }}
          TAVILY_API_KEY={{ tavily_api_key }}
          INTERNAL_SERVICE_SECRET={{ internal_service_secret }}
          DOCKER_IMAGE={{ docker_image }}
          # GPU Support (OCI A1 usually CPU only, but prepared)
          USE_GPU=False
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    # PHASE 2: Authenticate and Pull Image
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ docker_username }}"
        password: "{{ docker_password }}"
        registry: docker.io

    - name: Pull latest Docker image (ARM64)
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    # PHASE 3: Stop Current Deployment
    - name: Check if containers are running
      command: "docker compose -f {{ docker_compose_dir }}/docker-compose.yml ps"
      register: compose_ps
      changed_when: false
      failed_when: false

    - name: Backup current environment
      copy:
        src: "{{ docker_compose_dir }}/.env"
        dest: "{{ docker_compose_dir }}/.env.backup.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: yes
      failed_when: false
      when: "'app' in compose_ps.stdout"

    # PHASE 4: Update and Start Deployment (Near Zero Downtime)
    - name: Start new containers and remove orphans
      shell: |
        cd {{ docker_compose_dir }}
        docker compose up -d --remove-orphans
      register: compose_up
      changed_when: "'created' in compose_up.stdout or 'started' in compose_up.stdout"

    - name: Prune old images to save space
      shell: "docker image prune -af"
      failed_when: false

    # PHASE 5: Health Check
    - name: Wait for application to be ready (heavy start for ML models)
      uri:
        url: "{{ health_check_url }}"
        status_code: 200
        method: GET
        timeout: 10
      register: health_check
      until: health_check.status == 200
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      failed_when: false

    - name: Verify health status
      fail:
        msg: "❌ Recommendation System health check failed! Run: docker compose logs -f"
      when: health_check.status is defined and health_check.status != 200

  post_tasks:
    - name: Deployment summary
      debug:
        msg:
          - "✅ Recommendation System Deployed Successfully to OCI A1!"
          - "🏠 Host: {{ inventory_hostname }}"
          - "🔗 Health Check: {{ health_check_url }}"
